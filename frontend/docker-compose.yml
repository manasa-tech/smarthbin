services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartbin-backend
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:latest
      DATABASE_URL: sqlite:////app/data/smartbin.db
    volumes:
      - smartbin_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartbin-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  smartbin_data:
